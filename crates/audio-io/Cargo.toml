[package]
name = "audio-io"
description = "Audio file decoding (WAV/FLAC/MP3/AAC-M4A/Vorbis) and resampling for ChordLab; native + wasm32."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "aac", "isomp4", "ogg", "vorbis"] }
rubato = "0.16"
