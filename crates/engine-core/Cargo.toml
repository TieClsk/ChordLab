[package]
name = "engine-core"
description = "ChordLab audio engine core: project model, scheduler, instruments, mixer. Target-agnostic (native + wasm32)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Generates TypeScript types for the project model (run: cargo test -p engine-core --features ts)
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
ts-rs = { version = "11", optional = true, features = ["serde-compat"] }

[dev-dependencies]
serde_json = { workspace = true }
