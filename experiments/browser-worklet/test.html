<!doctype html>
<meta charset="utf-8">
<title>ChordLab engine · AudioWorklet spike</title>
<pre id="log"></pre>
<script type="module">
import { createRingBuffer, RingWriter } from '/packages/engine-web/src/ring.js';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log(s); };
const results = {};
const wasm = await (await fetch('/build/engine_wasm.wasm')).arrayBuffer();
const native = new Float32Array(await (await fetch('/build/native.f32')).arrayBuffer());
results.crossOriginIsolated = self.crossOriginIsolated;

function once(port, type) {
  return new Promise((res) => { const h = (e) => { if (e.data.type === type) { port.removeEventListener('message', h); res(e.data); } }; port.addEventListener('message', h); port.start(); });
}

async function makeNode(ctx, ring, status) {
  await ctx.audioWorklet.addModule('/packages/engine-web/src/worklet.js');
  const node = new AudioWorkletNode(ctx, 'chordlab-engine', { numberOfInputs: 0, outputChannelCount: [2], processorOptions: { wasm, ring, status } });
  await once(node.port, 'ready');
  node.connect(ctx.destination);
  return node;
}

// ---------- A: offline render in a real AudioWorklet, compare with native ----------
{
  const frames = native.length / 2;
  const ctx = new OfflineAudioContext(2, frames, 48000);
  const ring = createRingBuffer(64);
  const node = await makeNode(ctx, ring);
  node.port.postMessage({ type: 'demo', bars: 8 });
  await once(node.port, 'project-loaded');
  new RingWriter(ring).push(1); // Play — drained at the start of the first quantum
  const t = performance.now();
  const buf = await ctx.startRendering();
  const renderMs = performance.now() - t;
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let diff = 0, maxd = 0, first = -1;
  for (let i = 0; i < frames; i++) {
    const d = Math.max(Math.abs(L[i] - native[2 * i]), Math.abs(R[i] - native[2 * i + 1]));
    if (d > 0) { diff++; if (first < 0) first = i; }
    maxd = Math.max(maxd, d);
  }
  Object.assign(results, { offlineFrames: frames, offlineDiffSamples: diff, offlineMaxDiff: maxd, offlineFirstDiff: first, offlineRenderMs: Math.round(renderMs), offlineSpeedX: +(frames / 48000 / (renderMs / 1000)).toFixed(1) });
  log('A offline ' + JSON.stringify(results));
}

// ---------- B: realtime context, SAB command ring + status SAB ----------
try {
  const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await Promise.race([ctx.resume(), new Promise((_, rej) => setTimeout(() => rej(new Error('resume timeout, state=' + ctx.state)), 5000))]);
  const ring = createRingBuffer(1024);
  const status = new SharedArrayBuffer(8 * 4);
  const st = new Float64Array(status);
  log('B context state=' + ctx.state + ' sr=' + ctx.sampleRate);
  const node = await makeNode(ctx, ring, status);
  log('B node ready');
  results.workletHasTextEncoder = false; // see worklet.js
  node.port.postMessage({ type: 'project', bytes: new TextEncoder().encode(JSON.stringify({ tempo_bpm: 120, tracks: [{ name: 's', instrument: { kind: 'synth', wave: 'saw', cutoff_hz: 2000, resonance: 0.2, attack_s: 0.005, decay_s: 0.2, sustain: 0.7, release_s: 0.05 }, clips: [] }] })) });
  await once(node.port, 'project-loaded');
  const w = new RingWriter(ring);
  w.push(1);
  await new Promise((r) => setTimeout(r, 300));
  const lat = [];
  for (let i = 0; i < 40; i++) {
    const before = st[1];
    const t0 = performance.now();
    w.push(4, 0, 60 + (i % 12), 100); // NoteOn
    while (st[1] <= before && performance.now() - t0 < 200) await new Promise((r) => setTimeout(r, 0));
    lat.push(performance.now() - t0);
    w.push(5, 0, 60 + (i % 12)); // NoteOff
    await new Promise((r) => setTimeout(r, 60));
  }
  lat.sort((a, b) => a - b);
  const blocksBefore = st[3]; const tb = performance.now();
  await new Promise((r) => setTimeout(r, 1000));
  Object.assign(results, {
    rtState: ctx.state, rtSampleRate: ctx.sampleRate, baseLatencyMs: +(ctx.baseLatency * 1000).toFixed(2), outputLatencyMs: +((ctx.outputLatency || 0) * 1000).toFixed(2),
    cmdToVoiceMedianMs: +lat[lat.length >> 1].toFixed(2), cmdToVoiceP95Ms: +lat[Math.floor(lat.length * 0.95)].toFixed(2),
    blocksPerSecond: Math.round((st[3] - blocksBefore) / ((performance.now() - tb) / 1000)),
  });
  await ctx.close();
} catch (e) { results.realtimeError = String(e); }
log('B realtime ' + JSON.stringify(results));
window.__results = results;
</script>
