[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-wasm",
    "crates/engine-native",
    "crates/audio-io",
    "crates/sample-packs",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TieClsk/ChordLab"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
