name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude chordlab-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude chordlab-desktop --release
      - name: Generated TS types and contract fixtures are up to date
        run: |
          cargo test -p engine-core --features ts --lib
          UPDATE_FIXTURES=1 cargo test -p engine-core --test contract
          git diff --exit-code -- packages/engine-web/src/types packages/engine-web/test/fixtures

  wasm-parity:
    name: WASM build + native/WASM bit-exact parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p engine-wasm --target wasm32-unknown-unknown
      - run: cargo build --release -p audio-io --target wasm32-unknown-unknown
      - run: cargo run --release -p engine-native --bin chordlab-engine -- raw native.f32
      - run: node experiments/wasm-parity/run.mjs target/wasm32-unknown-unknown/release/engine_wasm.wasm native.f32
      - name: Report WASM size
        run: ls -l target/wasm32-unknown-unknown/release/engine_wasm.wasm

  web:
    name: Web · lint, typecheck, unit + browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @chordlab/web build:wasm
      - run: pnpm build
      - run: pnpm --filter @chordlab/web exec playwright install --with-deps chromium
      - run: pnpm --filter @chordlab/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  licenses:
    name: Dependency licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  desktop:
    name: Desktop (Tauri) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev libssl-dev pkg-config xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chordlab/web build
      - run: cargo clippy -p chordlab-desktop -- -D warnings
      - name: Desktop end-to-end self-test (React UI -> TauriBridge -> native engine)
        run: |
          printf 'pcm.!default { type plug slave.pcm "nullpcm" }\npcm.nullpcm { type null }\n' > ~/.asoundrc
          cargo build -p chordlab-desktop --features tauri/custom-protocol
          CHORDLAB_SELFTEST=1 timeout 120 xvfb-run -a ./target/debug/chordlab-desktop 2>&1 | tee smoke.log | grep SELFTEST_REPORT
          grep -q '"kind":"native"' smoke.log
          grep -q '"loaded":true' smoke.log
          grep -q '"timeouts":0' smoke.log
